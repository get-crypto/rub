[package]
name = "bls-signatures"
description = ""
version = "1.2.5"
edition = "2021"

[features]
legacy = []
bip32 = []
use_serde = ["serde"]
rub_helpers = ["rand"]
default = [ "legacy", "bip32", "rub_helpers", "use_serde"]
apple = ["bls-rub-sys/apple"]

[dependencies]
bls-rub-sys = { path = "../bls-rub-sys" }
serde = { version= "1.0.160", features = ["derive"], optional = true}
rand = { version= "0.8.5", optional = true}
hex = { version = "0.4.3"}
